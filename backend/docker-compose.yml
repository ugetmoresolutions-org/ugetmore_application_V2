services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ugetmore_dev
      POSTGRES_USER: ugetmore
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - ugetmore-postgres-data:/var/lib/postgresql/data

volumes:
  ugetmore-postgres-data:
